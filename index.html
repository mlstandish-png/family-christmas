<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1438">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Once Upon a Family Christmas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Great+Vibes&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --night:#0b1438; --night-2:#132055; --ink:#2b1a0c; --ink-soft:#5b4022;
  --gold:#e9bc55; --gold-hi:#fbe39a; --gold-lo:#a9771f;
  --red:#b51a2e; --red-lo:#6e0b18; --green:#13764c; --green-lo:#063a24;
  --blue:#2148a8; --blue-lo:#0d2160; --purple:#62309b; --purple-lo:#2e1052;
  --parch:#fbf0d6; --parch-2:#f2dfb4; --text:#fdf6e6; --muted:#c9cbe6;
  --ok:#1f9d63; --warn:#e7a12a; --bad:#d9465a;
  --serif:"Cinzel", "Trajan Pro", Georgia, "Times New Roman", serif;
  --script:"Great Vibes", "Snell Roundhand", "Apple Chancery", cursive;
  --sans:"Nunito", "Avenir Next", "Segoe UI", Roboto, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ color-scheme: dark; } }
:root[data-theme="dark"]{ color-scheme: dark; }
*,*::before,*::after{ box-sizing:inherit; }
html{ background:#0a1030; scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
body{
  margin:0; min-height:100%; color:var(--text); font-family:var(--sans); font-size:18px; line-height:1.5;
  background:
    radial-gradient(1200px 700px at 50% -10%, #2a3c8f 0%, rgba(42,60,143,0) 60%),
    radial-gradient(800px 600px at 100% 100%, rgba(98,48,155,.45) 0%, rgba(98,48,155,0) 60%),
    linear-gradient(180deg, #0b1438 0%, #0a1030 100%);
  background-attachment: fixed; background-color:#0a1030;
  -webkit-tap-highlight-color: transparent;
}
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:#0b1438; }
img{ max-width:100%; }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--gold-hi); outline-offset:3px; border-radius:10px; }
#snow{ position:fixed; inset:0; pointer-events:none; z-index:0; }
#app{ position:relative; z-index:1; max-width:640px; margin:0 auto; padding:0 14px 40px; }

/* ---------- typography ---------- */
h1,h2,h3{ font-family:var(--serif); font-weight:700; letter-spacing:.02em; margin:0; line-height:1.15; }
h2{ font-size:1.6rem; color:var(--gold-hi); text-shadow:0 2px 0 rgba(0,0,0,.35); }
h3{ font-size:1.2rem; }
.script{ font-family:var(--script); font-weight:400; }
.muted{ color:var(--muted); }
.center{ text-align:center; }
.small{ font-size:.9rem; }

/* ---------- top bar ---------- */
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; display:flex; align-items:center; gap:8px;
  margin:0 -14px 10px; padding:10px 14px; background:rgba(11,20,56,.88); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(233,188,85,.35); }
.topbar .home{ min-width:48px; min-height:48px; border-radius:14px; border:2px solid var(--gold); background:linear-gradient(180deg,#22357e,#101c4c);
  font-size:1.4rem; cursor:pointer; display:grid; place-items:center; }
.topbar .who{ flex:1; min-width:0; }
.topbar .who b{ display:block; font-family:var(--serif); font-size:1.05rem; color:var(--gold-hi); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar .who span{ font-size:.85rem; color:var(--muted); }
.pts-chip{ font-family:var(--serif); font-weight:900; color:var(--ink); background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  border:2px solid #fff3c4; border-radius:999px; padding:6px 12px; font-size:1rem; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.35); }
.sync{ display:inline-flex; align-items:center; gap:6px; font-size:.8rem; }
.sync i{ width:10px; height:10px; border-radius:50%; background:var(--ok); display:inline-block; box-shadow:0 0 6px var(--ok); }
.sync.pending i{ background:var(--warn); box-shadow:0 0 6px var(--warn); }
.sync.offline i{ background:var(--bad); box-shadow:0 0 6px var(--bad); }

/* ---------- title / landing ---------- */
.title-block{ text-align:center; padding:26px 6px 10px; }
.title-block .once{ font-family:var(--script); font-size:2.6rem; color:var(--gold-hi); line-height:1; display:block; text-shadow:0 0 18px rgba(251,227,154,.45); }
.title-block h1{ font-size:clamp(2rem, 9vw, 3.1rem); font-weight:900; line-height:1.05; margin-top:2px;
  background:linear-gradient(180deg,#fff7d6 0%, var(--gold-hi) 35%, var(--gold) 65%, #b8822a 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 3px 0 rgba(60,20,0,.55)); }
.title-block .sub{ font-family:var(--serif); font-size:1.05rem; color:#fff; margin-top:10px; }
.title-block .tag{ font-style:italic; color:var(--muted); margin-top:6px; }
.flourish{ display:flex; align-items:center; justify-content:center; gap:10px; color:var(--gold); margin:10px 0 4px; }
.flourish::before,.flourish::after{ content:""; height:1px; width:70px; background:linear-gradient(90deg,transparent,var(--gold)); }
.flourish::after{ transform:scaleX(-1); }

/* the artwork, uncropped, in a gilded frame */
.artframe{ position:relative; margin:14px auto 6px; padding:6px; border-radius:22px; max-width:520px;
  background:linear-gradient(135deg,#fff1b8,var(--gold) 25%,#8a5a12 50%,var(--gold) 75%,#fff1b8);
  box-shadow:0 18px 50px rgba(0,0,0,.55), 0 0 40px rgba(233,188,85,.25); }
.artframe .inner{ position:relative; border-radius:16px; overflow:hidden; border:2px solid #5a3a0c; background:#0b1438; }
.artframe img{ display:block; width:100%; height:auto; aspect-ratio:2/3; object-fit:contain; }
.hot{ position:absolute; border-radius:999px; background:transparent; border:0; cursor:pointer; }
.hot:active{ background:rgba(255,240,190,.25); }
.hot:focus-visible{ outline:3px solid #fff; }

/* ---------- jewel buttons (echo the artwork's buttons) ---------- */
.jewels{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0; }
.jewel{ position:relative; display:flex; align-items:center; gap:10px; min-height:84px; padding:12px 14px; border-radius:22px; cursor:pointer; text-align:left;
  border:3px solid var(--gold); color:#fff; font-family:var(--serif); font-weight:700; font-size:1.05rem; line-height:1.2;
  box-shadow: inset 0 0 0 2px rgba(255,240,190,.55), inset 0 10px 18px rgba(255,255,255,.18), 0 6px 0 var(--gold-lo), 0 10px 20px rgba(0,0,0,.45);
  text-shadow:0 2px 0 rgba(0,0,0,.35); transition:transform .12s ease, box-shadow .12s ease; }
.jewel:active{ transform:translateY(4px); box-shadow: inset 0 0 0 2px rgba(255,240,190,.55), 0 2px 0 var(--gold-lo), 0 4px 10px rgba(0,0,0,.45); }
.jewel .ic{ font-size:2rem; line-height:1; flex:0 0 auto; filter:drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
.jewel small{ display:block; font-family:var(--sans); font-weight:700; font-size:.8rem; opacity:.9; margin-top:2px; letter-spacing:0; }
.jewel.red{ background:linear-gradient(180deg,#d8324a,var(--red) 55%,var(--red-lo)); }
.jewel.green{ background:linear-gradient(180deg,#25a06b,var(--green) 55%,var(--green-lo)); }
.jewel.purple{ background:linear-gradient(180deg,#8452c4,var(--purple) 55%,var(--purple-lo)); }
.jewel.blue{ background:linear-gradient(180deg,#3d6be0,var(--blue) 55%,var(--blue-lo)); }
.jewel.gold{ background:linear-gradient(180deg,#fff0b0,var(--gold) 55%,#9c6a16); color:var(--ink); text-shadow:none; }
.jewel.wide{ grid-column:1 / -1; justify-content:center; }
.jewel[disabled]{ opacity:.5; cursor:not-allowed; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:54px; padding:12px 22px; border-radius:16px; cursor:pointer;
  font-family:var(--serif); font-weight:700; font-size:1.05rem; border:3px solid var(--gold); color:#fff;
  background:linear-gradient(180deg,#d8324a,var(--red) 55%,var(--red-lo)); box-shadow:inset 0 0 0 2px rgba(255,240,190,.5), 0 4px 0 var(--gold-lo); }
.btn:active{ transform:translateY(3px); box-shadow:inset 0 0 0 2px rgba(255,240,190,.5), 0 1px 0 var(--gold-lo); }
.btn.green{ background:linear-gradient(180deg,#25a06b,var(--green) 55%,var(--green-lo)); }
.btn.blue{ background:linear-gradient(180deg,#3d6be0,var(--blue) 55%,var(--blue-lo)); }
.btn.ghost{ background:rgba(255,255,255,.06); border-color:rgba(233,188,85,.6); box-shadow:none; }
.btn.block{ width:100%; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.linkbtn{ background:none; border:0; color:var(--gold-hi); text-decoration:underline; cursor:pointer; padding:10px; min-height:44px; font-size:1rem; }

/* ---------- parchment story cards (double gold border) ---------- */
.page{ position:relative; background:linear-gradient(180deg,var(--parch),var(--parch-2)); color:var(--ink); border-radius:18px; padding:18px 16px;
  border:3px solid var(--gold); box-shadow: inset 0 0 0 3px var(--parch), inset 0 0 0 5px var(--gold-lo), 0 10px 26px rgba(0,0,0,.45); margin:14px 0; }
.page h2,.page h3{ color:#7a1220; text-shadow:none; }
.page .muted{ color:var(--ink-soft); }
.page::before,.page::after{ content:"✦"; position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:var(--gold); font-size:1.2rem;
  background:var(--night); border-radius:50%; width:26px; height:26px; display:grid; place-items:center; border:2px solid var(--gold); }
.page::after{ top:auto; bottom:-14px; }
.page.plain::before,.page.plain::after{ display:none; }

.night-card{ background:rgba(16,28,78,.78); border:2px solid rgba(233,188,85,.55); border-radius:18px; padding:16px; margin:12px 0;
  box-shadow: inset 0 0 0 4px rgba(11,20,56,.9), inset 0 0 0 5px rgba(233,188,85,.25); }

/* prize ribbon */
.prize{ display:flex; align-items:center; gap:12px; justify-content:center; margin:10px 0; padding:10px 14px; border-radius:999px;
  background:linear-gradient(180deg,#d8324a,var(--red-lo)); border:3px solid var(--gold); box-shadow:0 6px 18px rgba(0,0,0,.4); }
.prize b{ font-family:var(--serif); font-size:1.6rem; color:var(--gold-hi); }
.prize span{ font-family:var(--serif); font-size:.95rem; }

/* ---------- forms ---------- */
label.lbl{ display:block; font-weight:800; margin:12px 0 6px; }
input[type=text],input[type=password],input[type=number],select,textarea{ width:100%; min-height:54px; font:inherit; font-size:1.1rem; padding:12px 14px;
  border-radius:14px; border:2px solid var(--gold-lo); background:#fffaf0; color:var(--ink); }
textarea{ min-height:90px; }
.err{ background:#fde3e6; color:#7a0f1d; border:2px solid #d9465a; border-radius:12px; padding:10px 12px; margin:10px 0; font-weight:700; }
.okmsg{ background:#e1f6ea; color:#0b4d2f; border:2px solid #1f9d63; border-radius:12px; padding:10px 12px; margin:10px 0; font-weight:700; }
.warnmsg{ background:#fff1d6; color:#6a4300; border:2px solid #e7a12a; border-radius:12px; padding:10px 12px; margin:10px 0; font-weight:700; }

/* ---------- player picker ---------- */
.players{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
.pcard{ min-height:96px; border-radius:18px; border:3px solid var(--gold); padding:10px; cursor:pointer; text-align:center; color:#fff;
  background:linear-gradient(180deg,#22357e,#101c4c); box-shadow:inset 0 0 0 2px rgba(255,240,190,.35), 0 4px 0 var(--gold-lo); }
.pcard .em{ font-size:2rem; display:block; }
.pcard b{ font-family:var(--serif); font-size:1.15rem; display:block; }
.pcard small{ color:var(--muted); font-size:.8rem; }
.pcard.sel{ background:linear-gradient(180deg,#d8324a,var(--red-lo)); }

/* ---------- day tabs ---------- */
.daytabs{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:8px 0 4px; }
.daytab{ min-height:62px; border-radius:14px; border:2px solid rgba(233,188,85,.5); background:rgba(255,255,255,.05); cursor:pointer; padding:6px 4px; line-height:1.15; }
.daytab b{ display:block; font-family:var(--serif); font-size:.95rem; }
.daytab small{ font-size:.75rem; color:var(--muted); }
.daytab.on{ border-color:var(--gold-hi); background:linear-gradient(180deg,#2c4296,#15225c); box-shadow:0 0 0 2px var(--gold) inset; }
.daytab.locked{ opacity:.55; }
.dayhero{ border-radius:18px; padding:18px 16px; margin:10px 0; border:3px solid var(--gold); text-align:center; color:#fff;
  box-shadow:inset 0 0 0 2px rgba(255,240,190,.5), 0 8px 20px rgba(0,0,0,.4); }
.dayhero .dname{ font-family:var(--script); font-size:2.1rem; color:var(--gold-hi); line-height:1.1; }
.dayhero h2{ color:#fff; font-size:1.45rem; }
.d1{ background:linear-gradient(160deg,#c42a40,var(--red-lo)); }
.d2{ background:linear-gradient(160deg,#1d8f5d,var(--green-lo)); }
.d3{ background:linear-gradient(160deg,#2f5bcc,var(--blue-lo)); }
.d4{ background:linear-gradient(160deg,#7a45b8,var(--purple-lo)); }

/* ---------- challenge items ---------- */
.ch{ display:flex; gap:12px; align-items:flex-start; padding:14px; border-radius:16px; background:#fffaf0; border:2px solid #e3c98a; margin:10px 0; color:var(--ink); }
.ch .ic{ font-size:1.9rem; line-height:1; }
.ch .body{ flex:1; min-width:0; }
.ch b{ font-family:var(--serif); font-size:1.08rem; display:block; color:#7a1220; }
.ch p{ margin:4px 0 8px; }
.badge{ display:inline-block; font-size:.78rem; font-weight:900; padding:3px 9px; border-radius:999px; margin-right:6px; }
.b-easy{ background:#d9f2e4; color:#0b4d2f; } .b-medium{ background:#dfe7ff; color:#1a2f78; } .b-bonus{ background:#fde7b0; color:#6a4300; }
.b-pts{ background:#7a1220; color:#fff3c4; }
.done-check{ display:inline-flex; align-items:center; gap:6px; font-weight:900; color:#0b6b40; }
.done-check::before{ content:"✓"; display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:radial-gradient(circle,#2fd08b,#0b6b40); color:#fff; border:2px solid var(--gold); }
.ch.done{ background:#eef9f1; border-color:#8fd3ad; }
.ch .go{ min-height:48px; padding:8px 14px; font-size:.95rem; }

/* ---------- trivia ---------- */
.qcard .qtext{ font-size:1.3rem; font-weight:800; line-height:1.35; margin:6px 0 14px; }
.opt{ display:block; width:100%; min-height:60px; text-align:left; padding:12px 16px; margin:10px 0; border-radius:16px; cursor:pointer;
  font-size:1.12rem; font-weight:800; background:#fffaf0; color:var(--ink); border:3px solid #e3c98a; }
.opt.sel{ border-color:var(--blue); background:#e5ecff; }
.opt.right{ border-color:#1f9d63; background:#d9f6e6; }
.opt.wrong{ border-color:#d9465a; background:#fde3e6; }
.opt[disabled]{ cursor:default; }
.fact{ background:#fff3cf; border:2px dashed var(--gold-lo); border-radius:14px; padding:12px; margin-top:12px; }
.qnav{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:10px 0; }
.qdot{ width:44px; height:44px; border-radius:50%; border:2px solid var(--gold); background:rgba(255,255,255,.06); cursor:pointer; font-weight:900; }
.qdot.ok{ background:#1f9d63; } .qdot.no{ background:#7a2232; } .qdot.cur{ box-shadow:0 0 0 3px var(--gold-hi); }
.qdot.bonus{ border-style:dashed; }

/* ---------- scoreboard ---------- */
.rank{ display:grid; grid-template-columns:52px 1fr auto; gap:10px; align-items:center; padding:12px; margin:10px 0; border-radius:18px;
  background:rgba(16,28,78,.85); border:2px solid rgba(233,188,85,.45); position:relative; transition:transform .4s ease; }
.rank .pos{ width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-family:var(--serif); font-weight:900; font-size:1.2rem;
  background:#1d2a66; border:2px solid rgba(233,188,85,.6); }
.rank .nm{ font-family:var(--serif); font-weight:700; font-size:1.15rem; }
.rank .det{ font-size:.85rem; color:var(--muted); }
.rank .tot{ font-family:var(--serif); font-weight:900; font-size:1.5rem; color:var(--gold-hi); text-align:right; line-height:1; }
.rank .tot small{ display:block; font-family:var(--sans); font-size:.7rem; color:var(--muted); font-weight:700; }
.rank.r1{ background:linear-gradient(135deg,#6b4a07,#2a1e05); border-color:#ffd970; box-shadow:0 0 22px rgba(255,217,112,.35); }
.rank.r1 .pos{ background:radial-gradient(circle at 35% 30%,#fff3b0,#d9a520 60%,#8a5d07); color:#3a2500; border-color:#fff3b0; }
.rank.r2{ background:linear-gradient(135deg,#4c5466,#1f2433); border-color:#e6ebf5; }
.rank.r2 .pos{ background:radial-gradient(circle at 35% 30%,#ffffff,#b9c2d4 60%,#6f7a8f); color:#1d2230; }
.rank.r3{ background:linear-gradient(135deg,#6b3b1a,#2c1709); border-color:#e7a46b; }
.rank.r3 .pos{ background:radial-gradient(circle at 35% 30%,#ffd2a8,#c27a3e 60%,#6e3d17); color:#2c1709; }
.rank.me{ outline:3px solid var(--gold-hi); outline-offset:2px; }
.rank.bump{ animation:bump 1.4s ease; }
@keyframes bump{ 0%{ box-shadow:0 0 0 0 rgba(251,227,154,.9);} 30%{ box-shadow:0 0 0 12px rgba(251,227,154,0); transform:scale(1.03);} 100%{ transform:scale(1);} }
.floatpts{ position:absolute; right:16px; top:-6px; font-family:var(--serif); font-weight:900; color:var(--gold-hi); font-size:1.3rem; pointer-events:none;
  animation:floatup 1.8s ease forwards; text-shadow:0 2px 6px rgba(0,0,0,.6); }
@keyframes floatup{ from{ opacity:1; transform:translateY(0);} to{ opacity:0; transform:translateY(-40px);} }
.legend{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; font-size:.85rem; color:var(--muted); }

/* ---------- gallery ---------- */
.filters{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.filters select{ min-height:48px; font-size:.95rem; padding:8px; }
.grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:12px; }
@media (min-width:520px){ .grid{ grid-template-columns:repeat(3,1fr); } }
.tile{ position:relative; border-radius:14px; overflow:hidden; border:2px solid var(--gold); background:#101c4c; aspect-ratio:1; cursor:pointer; padding:0; }
.tile img{ width:100%; height:100%; object-fit:cover; display:block; }
.tile .cap{ position:absolute; inset:auto 0 0 0; padding:6px 8px; background:linear-gradient(transparent,rgba(0,0,0,.8)); font-size:.78rem; text-align:left; line-height:1.25; }
.tile .ph{ position:absolute; inset:0; display:grid; place-items:center; font-size:1.6rem; opacity:.5; }

/* ---------- modal / lightbox ---------- */
.modal{ position:fixed; inset:0; z-index:50; background:rgba(5,9,28,.88); display:flex; align-items:flex-start; justify-content:center; overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 14px); }
.modal .box{ width:100%; max-width:600px; }
.modal .close{ position:sticky; top:0; float:right; min-width:48px; min-height:48px; border-radius:50%; border:2px solid var(--gold); background:var(--night); color:#fff; font-size:1.3rem; cursor:pointer; z-index:2; }
.modal img.full{ width:100%; height:auto; border-radius:14px; border:3px solid var(--gold); display:block; background:#000; }

/* ---------- toasts & celebration ---------- */
#toasts{ position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); z-index:60; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding:0 12px; }
.toast{ max-width:560px; width:100%; background:linear-gradient(180deg,#22357e,#101c4c); border:2px solid var(--gold); border-radius:16px; padding:12px 16px; font-weight:800;
  box-shadow:0 10px 30px rgba(0,0,0,.5); animation:tin .3s ease; }
.toast.bad{ background:linear-gradient(180deg,#8d1426,#4e0712); }
.toast.good{ background:linear-gradient(180deg,#17844f,#063a24); }
@keyframes tin{ from{ opacity:0; transform:translateY(16px);} to{ opacity:1; transform:none;} }
#fx{ position:fixed; inset:0; pointer-events:none; z-index:70; }
.burst{ position:fixed; left:50%; top:40%; transform:translate(-50%,-50%); z-index:71; pointer-events:none; text-align:center;
  font-family:var(--serif); font-weight:900; color:var(--gold-hi); font-size:3rem; text-shadow:0 4px 18px rgba(0,0,0,.7); animation:burst 1.8s ease forwards; }
.burst small{ display:block; font-size:1.1rem; color:#fff; }
@keyframes burst{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(.4);} 20%{ opacity:1; transform:translate(-50%,-50%) scale(1.1);} 70%{ opacity:1; transform:translate(-50%,-50%) scale(1);} 100%{ opacity:0; transform:translate(-50%,-60%) scale(1);} }

/* ---------- misc ---------- */
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.row > *{ flex:1 1 auto; }
.split{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.preview-img{ width:100%; border-radius:14px; border:3px solid var(--gold); margin-top:10px; display:block; }
.stat3{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; margin:10px 0; }
.stat3 div{ background:rgba(122,18,32,.08); border-radius:12px; padding:8px 4px; }
.stat3 b{ display:block; font-family:var(--serif); font-size:1.5rem; color:#7a1220; }
.thumbs{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.thumbs img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; border:2px solid var(--gold); }
.banner{ background:#fff1d6; color:#6a4300; border:2px solid #e7a12a; border-radius:12px; padding:8px 12px; margin:8px 0; font-weight:800; font-size:.9rem; text-align:center; }
.loading{ text-align:center; padding:60px 10px; font-family:var(--serif); color:var(--gold-hi); }
.spark{ display:inline-block; animation:tw 1.6s ease-in-out infinite; }
@keyframes tw{ 50%{ opacity:.35; transform:scale(.8);} }
body.simple{ font-size:20px; }
body.simple .ch p{ font-size:1.15rem; }
.footer{ text-align:center; margin-top:26px; color:var(--muted); font-size:.85rem; }
.org-list .item{ display:flex; gap:10px; align-items:center; padding:10px; border-bottom:1px solid #e3c98a; }
.org-list .item > div{ flex:1; min-width:0; }
.org-list .item img{ width:64px; height:64px; object-fit:cover; border-radius:10px; }
.mini{ min-height:44px; padding:6px 12px; font-size:.9rem; border-radius:12px; }
details.org{ background:#fffaf0; border:2px solid #e3c98a; border-radius:14px; margin:10px 0; padding:0 12px; }
details.org[open]{ padding-bottom:12px; }
details.org summary{ font-family:var(--serif); font-weight:700; font-size:1.1rem; color:#7a1220; padding:12px 0; cursor:pointer; }
.helper{ display:flex; gap:10px; align-items:center; justify-content:space-between; background:linear-gradient(90deg,#2a1a52,#1d2a66); border:2px solid var(--gold);
  border-radius:16px; padding:10px 12px; margin:10px 0; }
.helper b{ font-family:var(--serif); }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition:none !important; }
}
</style>

const withTimeout = (p, ms, code) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej({code:code||"timeout"}), ms))]);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const lsDel = (k) => { try { localStorage.removeItem(k); } catch(e){} };
const safeId = (s) => String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,40) || ("x"+Date.now().toString(36));
const photoId = (pid, cid) => pid + "__" + cid;

/* ---------------- Firebase ---------------- */
function FirebaseBackend(){
  const B = { kind:"firebase", member:false, organizer:false, uid:null };
  let db, auth, FV;

  B.init = async function(){
    if (!window.firebase || !firebase.initializeApp) throw { code:"sdk-missing" };
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth(); db = firebase.firestore(); FV = firebase.firestore.FieldValue;
    try { await db.enablePersistence({ synchronizeTabs:true }); } catch(e){ /* private mode or other tab: fine */ }
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
    let user = await new Promise(res => { const un = auth.onAuthStateChanged(u => { un(); res(u); }); });
    if (!user) { const cred = await withTimeout(auth.signInAnonymously(), 15000, "auth-timeout"); user = cred.user; }
    B.uid = user.uid;
    const flags = lsGet("ouafc_flags_"+B.uid, {});
    B.member = !!flags.member; B.organizer = !!flags.organizer;
    try {
      const [m, o] = await withTimeout(Promise.all([
        db.doc("members/"+B.uid).get().catch(e => (e && e.code==="permission-denied") ? { exists:false } : null),
        db.doc("organizers/"+B.uid).get().catch(e => (e && e.code==="permission-denied") ? { exists:false } : null)
      ]), 8000);
      if (m) B.member = m.exists; if (o) B.organizer = o.exists;
      lsSet("ouafc_flags_"+B.uid, { member:B.member, organizer:B.organizer });
    } catch(e) { /* offline: trust saved flags */ }
  };

  B.join = async function(code){
    code = String(code||"").trim();
    if (!code || /[\/\s]/.test(code)) throw { code:"bad-code" };
    try {
      await withTimeout(db.doc("members/"+B.uid).set({ code, at: Date.now(), ua: navigator.userAgent.slice(0,120) }), 15000, "offline");
    } catch(e) { if (e && e.code==="permission-denied") throw { code:"bad-code" }; throw e; }
    B.member = true; lsSet("ouafc_flags_"+B.uid, { member:true, organizer:B.organizer });
  };

  B.unlockOrganizer = async function(key){
    key = String(key||"").trim();
    if (!key || /[\/\s]/.test(key)) throw { code:"bad-key" };
    try {
      await withTimeout(db.doc("organizers/"+B.uid).set({ key, at: Date.now() }), 15000, "offline");
    } catch(e) { if (e && e.code==="permission-denied") throw { code:"bad-key" }; throw e; }
    B.organizer = true; lsSet("ouafc_flags_"+B.uid, { member:B.member, organizer:true });
  };

  B.leave = async function(){ lsDel("ouafc_flags_"+B.uid); try { await db.doc("members/"+B.uid).delete(); } catch(e){} };

  B.subscribe = function(h){
    const err = (what) => (e) => h.error && h.error(what, e);
    const mapOf = (snap) => { const o = {}; snap.forEach(d => o[d.id] = { id:d.id, ...d.data() }); return o; };
    const uns = [
      db.collection("players").onSnapshot(s => h.players(mapOf(s)), err("players")),
      db.collection("challenges").onSnapshot(s => h.challenges(mapOf(s)), err("challenges")),
      db.collection("trivia").onSnapshot(s => h.trivia(mapOf(s)), err("trivia")),
      db.doc("config/game").onSnapshot(d => h.config(d.exists ? d.data() : null), err("config")),
      db.collection("progress").onSnapshot({ includeMetadataChanges:true }, s => {
        h.progress(mapOf(s), { pending: s.metadata.hasPendingWrites, fromCache: s.metadata.fromCache });
      }, err("progress"))
    ];
    return () => uns.forEach(u => u());
  };

  B.answer = function(pid, qid, entry){
    return db.doc("progress/"+pid).update({ ["trivia."+qid]: entry, lastTrivia: qid });
  };

  B.submitPhoto = function(pid, cid, entry, full, thumb){
    const id = photoId(pid, cid), b = db.batch();
    b.set(db.doc("photos/"+id), { player:pid, cid, data:full });
    b.set(db.doc("thumbs/"+id), { player:pid, cid, data:thumb });
    b.update(db.doc("progress/"+pid), { ["photos."+cid]: entry, lastPhoto: cid });
    return b.commit();
  };

  const imgCache = {};
  B.getImage = async function(kind, id){
    const key = kind+"/"+id;
    if (imgCache[key]) return imgCache[key];
    const ref = db.doc(key);
    let snap = null;
    try { snap = await ref.get({ source:"cache" }); } catch(e){}
    if (!snap || !snap.exists) snap = await ref.get();
    const data = snap.exists ? snap.data().data : null;
    if (data) imgCache[key] = data;
    return data;
  };

  /* ---- organizer ---- */
  B.seed = async function(overwriteContent){
    const existing = await db.collection("progress").get();
    const have = new Set(existing.docs.map(d => d.id));
    const b = db.batch();
    PLAYERS.forEach(p => {
      b.set(db.doc("players/"+p.id), { name:p.name, emoji:p.emoji, order:p.order, active:true, simple:!!p.simple, helper:p.helper||null, note:p.note||"" }, { merge:true });
      if (!have.has(p.id)) b.set(db.doc("progress/"+p.id), { trivia:{}, photos:{}, adjust:{}, lastTrivia:"", lastPhoto:"" });
    });
    if (overwriteContent) {
      CHALLENGES.forEach(c => { const { id, ...rest } = c; b.set(db.doc("challenges/"+id), rest); });
      TRIVIA.forEach(t => { const { id, ...rest } = t; b.set(db.doc("trivia/"+id), rest); });
    }
    b.set(db.doc("config/game"), { installed:true, catchUp:true, openAll:false, finalized:false, winner:null, prize:50 }, { merge:true });
    await b.commit();
  };
  B.saveChallenge = (c) => { const { id, ...rest } = c; return db.doc("challenges/"+id).set(rest); };
  B.deleteChallenge = (id) => db.doc("challenges/"+id).delete();
  B.saveTrivia = (t) => { const { id, ...rest } = t; return db.doc("trivia/"+id).set(rest); };
  B.deleteTrivia = (id) => db.doc("trivia/"+id).delete();
  B.setConfig = (patch) => db.doc("config/game").set(patch, { merge:true });
  B.setPlayer = (id, patch) => db.doc("players/"+id).set(patch, { merge:true });
  B.removePhoto = async function(pid, cid){
    const id = photoId(pid, cid), b = db.batch();
    b.update(db.doc("progress/"+pid), { ["photos."+cid]: FV.delete() });
    b.delete(db.doc("photos/"+id)); b.delete(db.doc("thumbs/"+id));
    await b.commit(); delete imgCache["photos/"+id]; delete imgCache["thumbs/"+id];
  };
  B.removeAnswer = (pid, qid) => db.doc("progress/"+pid).update({ ["trivia."+qid]: FV.delete() });
  B.adjust = (pid, points, reason) => db.doc("progress/"+pid).update({ ["adjust.a"+Date.now().toString(36)]: { points, reason, at:Date.now() } });
  B.removeAdjust = (pid, aid) => db.doc("progress/"+pid).update({ ["adjust."+aid]: FV.delete() });
  B.listMembers = async () => (await db.collection("members").get()).docs.map(d => ({ uid:d.id, ...d.data() }));
  B.removeMember = (uid) => db.doc("members/"+uid).delete();
  B.setFamilyCode = async function(code){
    code = String(code||"").trim();
    if (!code || /[\/\s]/.test(code)) throw { code:"bad-code" };
    const old = await db.collection("accessKeys").get();
    const b = db.batch();
    old.docs.forEach(d => { if (d.id !== code) b.delete(d.ref); });
    b.set(db.doc("accessKeys/"+code), { at: Date.now() });
    await b.commit();
  };
  return B;
}

/* ---------------- Preview (local only) ---------------- */
function PreviewBackend(){
  const B = { kind:"preview", member:false, organizer:false, uid:"preview" };
  const K = "ouafc_preview_v1";
  let S, h = null; const imgs = {};
  const save = () => lsSet(K, S);
  const emit = () => { if (!h) return;
    h.players({ ...S.players }); h.challenges({ ...S.challenges }); h.trivia({ ...S.trivia });
    h.config(S.config); h.progress(JSON.parse(JSON.stringify(S.progress)), { pending:false, fromCache:false }); };
  B.init = async function(){
    S = lsGet(K, null);
    if (!S) { S = { players:{}, challenges:{}, trivia:{}, config:null, progress:{}, member:false, organizer:false }; await B.seed(true); }
    B.member = S.member; B.organizer = S.organizer;
  };
  B.join = async (code) => { if (!String(code||"").trim()) throw { code:"bad-code" }; S.member = B.member = true; save(); };
  B.unlockOrganizer = async (key) => { if (!String(key||"").trim()) throw { code:"bad-key" }; S.organizer = B.organizer = true; save(); };
  B.leave = async () => { S.member = B.member = false; save(); };
  B.subscribe = (handlers) => { h = handlers; setTimeout(emit, 30); return () => { h = null; }; };
  const later = (fn) => new Promise((res, rej) => setTimeout(() => { try { fn(); save(); emit(); res(); } catch(e){ rej(e); } }, 250));
  B.answer = (pid, qid, entry) => later(() => {
    const p = S.progress[pid]; if (p.trivia[qid]) throw { code:"permission-denied" }; p.trivia[qid] = entry; });
  B.submitPhoto = (pid, cid, entry, full, thumb) => later(() => {
    const p = S.progress[pid]; if (p.photos[cid]) throw { code:"permission-denied" };
    p.photos[cid] = entry; imgs["photos/"+photoId(pid,cid)] = full; imgs["thumbs/"+photoId(pid,cid)] = thumb; });
  B.getImage = async (kind, id) => imgs[kind+"/"+id] || null;
  B.seed = async function(overwrite){
    PLAYERS.forEach(p => { S.players[p.id] = { id:p.id, name:p.name, emoji:p.emoji, order:p.order, active:true, simple:!!p.simple, helper:p.helper||null, note:p.note||"" };
      if (!S.progress[p.id]) S.progress[p.id] = { id:p.id, trivia:{}, photos:{}, adjust:{} }; });
    if (overwrite) { S.challenges = {}; S.trivia = {};
      CHALLENGES.forEach(c => S.challenges[c.id] = { ...c }); TRIVIA.forEach(t => S.trivia[t.id] = { ...t }); }
    S.config = { installed:true, catchUp:true, openAll:false, finalized:false, winner:null, prize:50, ...(S.config||{}) };
    save(); emit();
  };
  B.saveChallenge = (c) => later(() => { S.challenges[c.id] = { ...c }; });
  B.deleteChallenge = (id) => later(() => { delete S.challenges[id]; });
  B.saveTrivia = (t) => later(() => { S.trivia[t.id] = { ...t }; });
  B.deleteTrivia = (id) => later(() => { delete S.trivia[id]; });
  B.setConfig = (patch) => later(() => { S.config = { ...S.config, ...patch }; });
  B.setPlayer = (id, patch) => later(() => { S.players[id] = { ...S.players[id], ...patch }; });
  B.removePhoto = (pid, cid) => later(() => { delete S.progress[pid].photos[cid]; delete imgs["photos/"+photoId(pid,cid)]; delete imgs["thumbs/"+photoId(pid,cid)]; });
  B.removeAnswer = (pid, qid) => later(() => { delete S.progress[pid].trivia[qid]; });
  B.adjust = (pid, points, reason) => later(() => { S.progress[pid].adjust["a"+Date.now().toString(36)] = { points, reason, at:Date.now() }; });
  B.removeAdjust = (pid, aid) => later(() => { delete S.progress[pid].adjust[aid]; });
  B.listMembers = async () => [{ uid:"preview", code:"(preview)", at:Date.now(), ua:navigator.userAgent.slice(0,60) }];
  B.removeMember = async () => {};
  B.setFamilyCode = async () => {};
  B.resetPreview = () => { lsDel(K); location.reload(); };
  return B;
}

const todayLA = () => new Intl.DateTimeFormat("en-CA", { timeZone:"America/Los_Angeles", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date());
const effToday = () => (st.backend && st.backend.organizer && st.previewDate) ? st.previewDate : todayLA();
const dayOf = (n) => DAYS.find(d => d.n === Number(n)) || DAYS[0];

function hashStr(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function seededOrder(n, seed){ let x = hashStr(seed) || 1; const a = [...Array(n).keys()];
  for (let i=n-1;i>0;i--){ x ^= x << 13; x ^= x >>> 17; x ^= x << 5; x >>>= 0; const j = x % (i+1); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const sortBy = (arr, f) => arr.slice().sort((a,b) => (f(a) > f(b) ? 1 : f(a) < f(b) ? -1 : 0));
const playerList = () => sortBy(Object.values(st.players).filter(p => p.active !== false), p => p.order || 99);

function dayState(n){
  const d = dayOf(n), t = effToday(), c = st.config || {};
  if (c.finalized) return t >= d.date || c.openAll ? "closed" : "locked";
  if (c.openAll) return "open";
  if (t < d.date) return "locked";
  if (t === d.date) return "open";
  return c.catchUp === false ? "closed" : "open";
}
const dayOpen = (n) => dayState(n) === "open";
function currentDay(){ const t = effToday(); let cur = 1; DAYS.forEach(d => { if (t >= d.date) cur = d.n; }); return cur; }

function totals(pid){
  const p = st.progress[pid] || {}; let trivia = 0, photo = 0, adj = 0, tCount = 0, tRight = 0, pCount = 0;
  Object.values(p.trivia || {}).forEach(a => { trivia += a.points || 0; tCount++; if (a.correct) tRight++; });
  Object.values(p.photos || {}).forEach(e => { if (e.status === "ok") { photo += e.points || 0; pCount++; } });
  Object.values(p.adjust || {}).forEach(a => adj += Number(a.points) || 0);
  return { trivia, photo, adj, total: trivia + photo + adj, tCount, tRight, pCount };
}
function standings(){
  const rows = playerList().map(p => ({ p, ...totals(p.id) }));
  rows.sort((a,b) => b.total - a.total || (a.p.order||0) - (b.p.order||0));
  let rank = 0, last = null;
  rows.forEach((r,i) => { if (r.total !== last) { rank = i + 1; last = r.total; } r.rank = rank; });
  return rows;
}

/* ---------- toasts & effects ---------- */
function toast(msg, kind, ms){
  const t = document.createElement("div"); t.className = "toast " + (kind || ""); t.textContent = msg;
  document.getElementById("toasts").appendChild(t);
  setTimeout(() => { t.style.transition = "opacity .4s"; t.style.opacity = "0"; setTimeout(() => t.remove(), 450); }, ms || 3600);
}
function burst(big, small){
  const b = document.createElement("div"); b.className = "burst"; b.innerHTML = esc(big) + (small ? "<small>" + esc(small) + "</small>" : "");
  document.body.appendChild(b); setTimeout(() => b.remove(), 1900);
}
const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const FX = { parts:[], running:false, until:0 };
const fxCanvas = document.getElementById("fx"), fxc = fxCanvas.getContext("2d");
const FX_COLORS = ["#fbe39a","#e9bc55","#d8324a","#25a06b","#3d6be0","#8452c4","#ffffff"];
function fxSize(){ const r = Math.min(devicePixelRatio || 1, 2); fxCanvas.width = innerWidth * r; fxCanvas.height = innerHeight * r; fxCanvas.style.width = innerWidth+"px"; fxCanvas.style.height = innerHeight+"px"; fxc.setTransform(r,0,0,r,0,0); }
function confetti(n){
  if (reduceMotion()) return;
  for (let i=0;i<(n||120);i++) FX.parts.push({ k:"c", x:innerWidth/2 + (Math.random()-.5)*innerWidth*.6, y:innerHeight*.35, vx:(Math.random()-.5)*9, vy:-Math.random()*11-3,
    r:4+Math.random()*5, a:Math.random()*6, va:(Math.random()-.5)*.3, c:FX_COLORS[i % FX_COLORS.length], life:200 });
  runFx();
}
function firework(x, y){
  const c = FX_COLORS[Math.floor(Math.random()*FX_COLORS.length)];
  for (let i=0;i<60;i++){ const a = Math.PI*2*i/60, s = 2+Math.random()*3.5;
    FX.parts.push({ k:"s", x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, c, life:70+Math.random()*30 }); }
}
function fireworks(ms){
  if (reduceMotion()) return;
  FX.until = Date.now() + (ms || 5000); runFx();
}
function runFx(){
  if (FX.running) return; FX.running = true; fxSize();
  let tick = 0;
  const step = () => {
    fxc.clearRect(0,0,innerWidth,innerHeight); tick++;
    if (Date.now() < FX.until && tick % 22 === 0) firework(innerWidth*(.15+Math.random()*.7), innerHeight*(.12+Math.random()*.35));
    FX.parts = FX.parts.filter(p => p.life-- > 0 && p.y < innerHeight + 40);
    FX.parts.forEach(p => {
      if (p.k === "c") { p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        fxc.save(); fxc.translate(p.x,p.y); fxc.rotate(p.a); fxc.fillStyle = p.c; fxc.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); fxc.restore(); }
      else { p.vy += .04; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy;
        fxc.globalAlpha = Math.max(0, Math.min(1, p.life/60)); fxc.fillStyle = p.c; fxc.beginPath(); fxc.arc(p.x,p.y,2.2,0,7); fxc.fill(); fxc.globalAlpha = 1; }
    });
    if (FX.parts.length || Date.now() < FX.until) requestAnimationFrame(step); else { FX.running = false; fxc.clearRect(0,0,innerWidth,innerHeight); }
  };
  requestAnimationFrame(step);
}
(function snow(){
  const c = document.getElementById("snow"), x = c.getContext("2d"); if (reduceMotion()) return;
  let flakes = [], W, H;
  const size = () => { const r = Math.min(devicePixelRatio||1, 2); W = innerWidth; H = innerHeight; c.width = W*r; c.height = H*r; c.style.width = W+"px"; c.style.height = H+"px"; x.setTransform(r,0,0,r,0,0); };
  size(); addEventListener("resize", size);
  for (let i=0;i<55;i++) flakes.push({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*2.2+.6, s:Math.random()*.6+.25, d:Math.random()*6 });
  const loop = () => {
    if (!document.hidden) { x.clearRect(0,0,W,H); x.fillStyle = "rgba(255,255,255,.75)";
      flakes.forEach(f => { f.y += f.s; f.d += .01; f.x += Math.sin(f.d)*.3; if (f.y > H+4) { f.y = -4; f.x = Math.random()*W; } x.beginPath(); x.arc(f.x,f.y,f.r,0,7); x.fill(); }); }
    requestAnimationFrame(loop);
  };
  loop();
})();

function speak(text){
  try { if (!("speechSynthesis" in window)) { toast("Read-aloud isn’t available on this phone.", "bad"); return; }
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = .92; speechSynthesis.speak(u); } catch(e){}
}

/* ---------- photos ---------- */
function loadImg(file){
  return new Promise((res, rej) => { const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(url), 2000); };
    im.onerror = () => { URL.revokeObjectURL(url); rej({ code:"bad-image" }); }; im.src = url; });
}
function shrink(im, maxDim, q, maxChars){
  let scale = Math.min(1, maxDim / Math.max(im.naturalWidth, im.naturalHeight)), out = "";
  for (let tries = 0; tries < 6; tries++){
    const cv = document.createElement("canvas"); cv.width = Math.round(im.naturalWidth*scale); cv.height = Math.round(im.naturalHeight*scale);
    cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
    let qq = q; out = cv.toDataURL("image/jpeg", qq);
    while (out.length > maxChars && qq > .4) { qq -= .1; out = cv.toDataURL("image/jpeg", qq); }
    if (out.length <= maxChars) return out; scale *= .8;
  }
  return out;
}

async function submitPhoto(){

function lockAnswer(qid){
  const q = st.trivia[qid], me = st.me, choice = st.triviaSel[qid], prog = st.progress[me] || {};
  if (!q || choice == null || (prog.trivia && prog.trivia[qid]) || !dayOpen(q.day)) return;
  const correct = choice === q.answer;
  const entry = { choice, correct, points: correct ? q.points : 0, at: Date.now(), day: q.day };
  // show it right away; Firestore keeps it on the phone until it syncs
  st.progress[me] = { ...prog, trivia: { ...(prog.trivia||{}), [qid]: entry } };
  delete st.triviaSel[qid];
  render(true);
  if (correct) { burst("+" + q.points, "Correct!"); confetti(120); } else toast("Good guess! Read the fun fact below.", "", 2500);
  st.backend.answer(me, qid, entry).catch(e => {
    toast(e && e.code === "permission-denied" ? "That answer was already saved on another phone, so it wasn’t counted twice."
      : "That answer hasn’t synced yet. Check your signal; it will retry.", "bad", 6000);
  });
}

let thumbObserver = null;
function hydrateThumbs(){
  if (thumbObserver) thumbObserver.disconnect();
  const tiles = $app.querySelectorAll("[data-thumb]"); if (!tiles.length) return;
  const load = async (el) => { const id = el.dataset.thumb; if (st.thumbs[id]) return;
    try { const data = await st.backend.getImage("thumbs", id);
      if (data) { st.thumbs[id] = data; const ph = el.querySelector(".ph"); if (ph) { const im = document.createElement("img"); im.alt = ""; im.src = data; ph.replaceWith(im); } }
    } catch(e) { const ph = el.querySelector(".ph"); if (ph) ph.textContent = "⚠️"; } };
  if (!("IntersectionObserver" in window)) { tiles.forEach(load); return; }
  thumbObserver = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { thumbObserver.unobserve(e.target); load(e.target); } }), { rootMargin:"300px" });
  tiles.forEach(t => thumbObserver.observe(t));
}

const val = (id) => { const e = document.getElementById(id); return e ? e.value : ""; };
const checked = (id) => { const e = document.getElementById(id); return !!(e && e.checked); };
async function orgDo(fn, okMsg){
  try { await withTimeout(Promise.resolve(fn()), 20000, "offline"); if (okMsg) toast(okMsg, "good"); return true; }
  catch(e) { toast(e && e.code === "permission-denied" ? "Not allowed. Make sure organizer tools are unlocked on this phone." : e && e.code === "offline" ? "No connection. Try again when you have signal." : "Something went wrong: " + ((e && (e.message || e.code)) || "unknown"), "bad", 6000); return false; }
}

/* ============================================================
   Main render + events
   ============================================================ */
function render(force){
  if (!force && (inputFocused() || document.getElementById("modal"))) { st.dirty = true; return; }
  st.dirty = false;
  const B = st.backend, r = route();
  document.querySelectorAll("details.org").forEach(d => { st.orgOpen[d.dataset.k] = d.open; });
  let html;
  if (st.fatal) html = st.fatal;
  else if (!B) html = loadingHTML();
  else if (r.v === "organizer") html = screenOrganizer();
  else if (!B.member && !B.organizer) html = r.v === "code" ? screenCode() : screenLanding();
  else if (!isReady()) html = loadingHTML(online() ? "Gathering the family…" : "Waiting for signal to load the game for the first time…");
  else if (!st.config || !st.config.installed) html = screenNotInstalled();
  else if (!st.me || !st.players[st.me] || r.v === "pick") html = screenPick();
  else switch (r.v) {
    case "today": html = screenToday(r.a); break;
    case "upload": html = screenUpload(r.a); break;
    case "scoreboard": html = screenScoreboard(); break;
    case "team": html = screenTeam(); break;
    case "trivia": html = screenTrivia(r.a); break;
    case "gallery": html = screenGallery(); break;
    case "finale": html = screenFinale(); break;
    default: html = screenHome();
  }
  document.body.classList.toggle("simple", !!(meP() && meP().simple));
  $app.innerHTML = html;
  hydrateThumbs();
}

let unsub = null;
function startData(){
  if (unsub) return;
  unsub = st.backend.subscribe({
    players: (m) => { st.players = m; st.loaded.add("players"); render(); },
    challenges: (m) => { Object.values(m).forEach(c => { c.day = Number(c.day); c.points = Number(c.points); }); st.challenges = m; st.loaded.add("challenges"); render(); },
    trivia: (m) => { Object.values(m).forEach(t => { t.day = Number(t.day); t.points = Number(t.points); t.answer = Number(t.answer); }); st.trivia = m; st.loaded.add("trivia"); render(); },
    config: (c) => { st.config = c; st.loaded.add("config"); render(); },
    progress: (m, meta) => {
      st.progress = m; st.sync = meta || st.sync; st.loaded.add("progress");
      const now = {}; Object.keys(m).forEach(id => now[id] = totals(id).total);
      if (st.prevTotals) Object.keys(now).forEach(id => { const d = now[id] - (st.prevTotals[id] || 0);
        if (d > 0) { st.bumps[id] = { delta:d, t:Date.now() }; if (id !== st.me && st.players[id]) toast("✨ " + pName(id) + " earned +" + d + " points!", "", 3000); } });
      st.prevTotals = now; render();
    },
    error: (what, e) => {
      if (e && e.code === "permission-denied") {
        if (unsub) { unsub(); unsub = null; }
        st.loaded.clear(); st.backend.member = false; st.backend.organizer = false;
        lsSet("ouafc_flags_" + st.backend.uid, {});
        toast("This phone needs the family code again.", "bad", 6000); go("code");
      } else toast("Live updates paused (" + (e && e.code || "connection") + "). They’ll resume when the signal returns.", "bad", 5000);
    }
  });
}

  orgEditCh: (d) => chEditor(d.c),
  orgEditQ: (d) => qEditor(d.q),
  orgSaveCh: () => { const id = document.getElementById("chEd").dataset.id, title = val("e_title").trim();
    if (!title) { toast("Give the challenge a title.", "bad"); return; }
    const old = st.challenges[id] || {};
    const c = { id: id || ("c_" + safeId(title) + "_" + Date.now().toString(36).slice(-4)), title, desc: val("e_desc").trim(), day: Number(val("e_day")),
      icon: val("e_icon").trim() || "✨", level: val("e_level"), points: Math.max(0, parseInt(val("e_points"),10) || 0), active: checked("e_active"), order: old.order || 99 };
    orgDo(() => st.backend.saveChallenge(c), "Challenge saved").then(ok => ok && closeModal()); },
  orgDelCh: (d) => { if (confirm("Delete this challenge?")) orgDo(() => st.backend.deleteChallenge(d.c), "Challenge deleted").then(ok => ok && closeModal()); },
  orgSaveQ: () => { const id = document.getElementById("qEd").dataset.id, q = val("q_q").trim(), opts = [0,1,2,3].map(i => val("q_o"+i).trim());
    if (!q || opts.some(o => !o)) { toast("Fill in the question and all four answers.", "bad"); return; }
    const old = st.trivia[id] || {};
    const t = { id: id || ("q_" + Date.now().toString(36)), q, options: opts, answer: Number(val("q_ans")), fact: val("q_fact").trim(), day: Number(val("q_day")),
      points: Math.max(0, parseInt(val("q_points"),10) || 0), level: val("q_level"), bonus: checked("q_bonus"), active: checked("q_active"), order: old.order || 99 };
    orgDo(() => st.backend.saveTrivia(t), "Question saved").then(ok => ok && closeModal()); },
  orgDelQ: (d) => { if (confirm("Delete this question? Points already earned for it are kept.")) orgDo(() => st.backend.deleteTrivia(d.q), "Question deleted").then(ok => ok && closeModal()); },
  orgFinal: () => { const w = val("winSel"); if (!w) return;
    if (confirm("Reveal " + pName(w) + " as the winner to everyone?")) orgDo(() => st.backend.setConfig({ finalized:true, winner:w, finalNote: val("winNote").trim() }), "Winner revealed!").then(ok => { if (ok) { st.finaleShown = false; go("finale"); } }); },
  orgUnfinal: () => { if (confirm("Hide the winner and reopen the game?")) orgDo(() => st.backend.setConfig({ finalized:false, winner:null }), "Reveal undone"); }
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const fn = actions[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset, el);
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (e.target.id === "code") actions.join();
  if (e.target.id === "orgKey") actions.orgUnlock();
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.matches("input[type=file][data-file]")) { onPickFile(t.files && t.files[0]); t.value = ""; return; }
  const k = t.dataset.ch; if (!k) return;
  if (k === "upCid") { st.upload.cid = t.value; st.upload.status = st.upload.status === "error" ? "" : st.upload.status; t.blur(); render(true); }
  else if (k === "gDay") { st.gallery.day = t.value; t.blur(); render(true); }
  else if (k === "gPlayer") { st.gallery.player = t.value; t.blur(); render(true); }
  else if (k === "gCh") { st.gallery.ch = t.value; t.blur(); render(true); }
  else if (k === "pvDate") { st.previewDate = t.value; lsSet("ouafc_preview_date", t.value); t.blur(); render(true); toast(t.value ? "This phone now previews " + t.value : "Back to the real date", "good"); }
  else if (k === "cfgOpenAll") orgDo(() => st.backend.setConfig({ openAll: t.checked }), t.checked ? "All days open for everyone" : "Days follow the calendar again");
  else if (k === "cfgCatchUp") orgDo(() => st.backend.setConfig({ catchUp: t.checked }), t.checked ? "Catch-up allowed" : "Earlier days now close at midnight");
  else if (k === "cfgPrize") { const n = parseInt(t.value, 10); if (n > 0) orgDo(() => st.backend.setConfig({ prize: n }), "Prize set to $" + n); }
});
document.addEventListener("input", (e) => { if (e.target.dataset.in === "caption") st.upload.caption = e.target.value; });
document.addEventListener("toggle", (e) => { if (e.target.matches && e.target.matches("details.org")) st.orgOpen[e.target.dataset.k] = e.target.open; }, true);
setInterval(() => { if (route().v === "" || route().v === "home" || route().v === "today" || route().v === "trivia") render(); }, 60000);

/* ============================================================
   Boot
   ============================================================ */
(async function boot(){
  try { const src = document.getElementById("castleSrc").getAttribute("src"), b64 = src.split(",")[1], bin = atob(b64), u8 = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i); CASTLE = URL.createObjectURL(new Blob([u8], { type:"image/jpeg" }));
    document.getElementById("castleSrc").removeAttribute("src");
  } catch(e) { CASTLE = document.getElementById("castleSrc").getAttribute("src"); }

  let blocked = false;
  document.addEventListener("securitypolicyviolation", (e) => { if (/googleapis|firebase|gstatic/.test(e.blockedURI || "")) blocked = true; });
  const wantPreview = /[?&]preview\b/.test(location.search) || lsGet("ouafc_force_preview", false);

  async function usePreview(){ st.backend = PreviewBackend(); await st.backend.init(); if (st.backend.member || st.backend.organizer) startData(); render(true); }

  if (wantPreview || !window.firebase) return usePreview();
  // Inside Claude's preview, outside connections are blocked: detect that quickly and use the practice copy.
  try { await withTimeout(fetch("https://firestore.googleapis.com/", { mode:"no-cors", cache:"no-store" }), 4000); }
  catch(e) { await new Promise(r => setTimeout(r, 400)); if (blocked) return usePreview(); }
  try {
    st.backend = FirebaseBackend();
    await st.backend.init();
    if (st.backend.member || st.backend.organizer) startData();
    render(true);
  } catch(e) {
    if (blocked || (e && e.code === "sdk-missing")) return usePreview();
    const code = (e && (e.code || e.message)) || "unknown";
    const hint = /operation-not-allowed|admin-restricted|configuration-not-found/.test(code) ? "Anonymous sign-in isn’t turned on yet in Firebase (Authentication → Sign-in method → Anonymous)."
      : /network|timeout|unavailable/.test(code) ? "The phone couldn’t reach the game server. Check signal or Wi-Fi, then reload."
      : "The game couldn’t start.";
    st.fatal = `${titleBlock()}<section class="page center"><h2>The storybook is stuck</h2><p>${esc(hint)}</p><p class="small muted">Details: ${esc(code)}</p>
      <p><button class="btn" onclick="location.reload()">Try again</button></p>
      <p><button class="linkbtn" style="color:var(--ink-soft)" onclick="localStorage.setItem('ouafc_force_preview','true');location.reload()">Open a practice copy on this phone instead</button></p></section>`;
    render(true);
  }
})();

</script>
